<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
        <title>
            Diet Planner | مكتبة الدايت
        </title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="css/tailwind.css?v=20260923-2">
        <link rel="stylesheet" href="css/diet.css?v=20261120-title-actions-v2">
        <link rel="stylesheet" href="css/design-tokens.css?v=20261122-responsive-foundation-v1">
<link rel="stylesheet" href="css/light-theme.css?v=20261120-central-v2">
<link rel="stylesheet" href="css/dark-theme.css?v=20261120-central-v4">
<link rel="stylesheet" href="css/dp-confirm.css?v=20261122-simple-confirm-v1">
        <script src="js/theme.js?v=20261121-header-only-v15">
        </script>
      <link rel="stylesheet" href="css/components.css?v=20261120-central-v2">
  <link rel="stylesheet" href="css/app-header.css?v=20261124-contact-v1">
  <script src="js/app-header.js?v=20261124-contact-v1" defer></script>
  <link rel="stylesheet" href="css/diet-builder.css?v=20261123-central-meal-builder-v2">
        <link rel="stylesheet" href="css/nutrition-summary.css?v=20261123-central-summary-v2">
</head>
    <body>
        <div id="loading" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#f7fafb]">
          <div class="flex flex-col items-center gap-3">
            <div class="spinner"></div>
            <span id="loadingText" class="text-sm font-semibold text-slate-500">جاري تحميل مكتبة الدايت...</span>
            <button id="loadingRetry" type="button" class="hidden rounded-xl bg-teal-700 px-4 py-2 text-sm font-bold text-white">إعادة المحاولة</button>
          </div>
        </div>
        <main class="min-h-screen p-4 sm:p-6">
            <div class="mx-auto max-w-[1550px]">
                <div data-dp-app-header data-page-title="مكتبة الدايت"></div><div data-dp-page-actions data-placement="title"><div class="diet-header-actions">
                        <button id="newBtn" class="diet-create-btn" type="button"><i class="fa-solid fa-plus" aria-hidden="true"></i> إنشاء دايت جديد</button>
                      </div></div>          </nav>

                <section class="mt-5 glass rounded-3xl p-2 sm:p-3 diet-library-toolbar">
                    <div class="diet-library-controls">
                        <div class="relative diet-search-wrap">
                            <i class="fa-solid fa-magnifying-glass absolute right-2 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input id="search" class="w-full rounded-xl border border-slate-200 bg-white py-2 pr-7 pl-2 text-xs" placeholder="بحث الدايت">
                        </div>
                        <select id="visibilityFilter" class="rounded-xl border border-slate-200 bg-white px-1 py-2 text-xs font-semibold diet-visibility">
                            <option value="all">كل الدايت</option>
                            <option value="mine">دايتي</option>
                            <option value="public">منشورة</option>
                        </select>
                        <div class="diet-stat-mini"><span>إجمالي القوالب</span><strong id="totalStat">0</strong></div>
                        <div class="diet-stat-mini"><span>قوالبي الخاصة</span><strong id="mineStat">0</strong></div>
                        <div class="diet-stat-mini"><span>منشورة</span><strong id="publicStat">0</strong></div>
                    </div>
                </section>
                <span id="statusStat" hidden></span>
                <section id="dietGrid" class="mt-5 grid gap-4 lg:grid-cols-2 xl:grid-cols-3">
                </section>
                <div id="empty" class="glass mt-5 hidden rounded-3xl p-14 text-center">
                    <i class="fa-solid fa-book-open text-5xl text-slate-200"></i>
                    <p class="mt-4 font-extrabold text-slate-600">
                        لا توجد قوالب دايت
                    </p>
                    <p class="mt-1 text-xs text-slate-400">
                        أنشئ أول قالب من زر «إنشاء دايت جديد»
                    </p>
                </div>
                <footer class="py-7 text-center text-xs text-slate-400">
                    Developed by<span class="font-bold text-brand-600">Dr. Ahmed Galal</span>
                </footer>
            </div>
        </main>
        <div id="editor" class="modal-bg fixed inset-0 z-[80] hidden items-start justify-center overflow-y-auto p-3 sm:p-6">
            <div class="my-2 w-full max-w-[1500px] rounded-3xl bg-[#f7fafb] shadow-2xl">
                <div class="sticky top-0 z-20 flex items-center justify-between gap-3 rounded-t-3xl border-b border-slate-100 bg-white px-5 py-4">
                    <div>
                        <h2 id="editorTitle" class="text-lg font-extrabold">
                            إنشاء دايت جديد
                        </h2>
                        <p class="mt-1 text-[11px] text-slate-400">
                            قالب يمثل يومًا غذائيًا واحدًا فقط
                        </p>
                    </div>
                    <div class="flex gap-2">
                        <button id="cancelEditor" class="rounded-xl bg-slate-100 px-4 py-2 text-xs font-bold text-slate-600">
                            إلغاء
                        </button>
                        <button id="saveDiet" class="rounded-xl bg-brand-600 px-5 py-2 text-xs font-bold text-white">
                            حفظ الدايت
                        </button>
                    </div>
                </div>
                <div class="p-4 sm:p-6">
                    <section class="glass rounded-3xl p-5">
                        <div class="mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-circle-info text-brand-600"></i>
                            <h3 class="font-extrabold">
                                بيانات القالب
                            </h3>
                        </div>
                        <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                            <label class="lg:col-span-1">
                                <span class="text-xs font-bold text-slate-600">اسم الدايت *</span><input id="dietName" class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm" placeholder="مثال: دايت 1800 سعر - مصري">
                            </label>
                            <label>
                                <span class="text-xs font-bold text-slate-600">الوصف</span><input id="description" class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm" placeholder="وصف مختصر للدايت">
                            </label>
                            <label>
                                <span class="text-xs font-bold text-slate-600">حالة القالب</span>
                                <select id="visibility" class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold">
                                    <option value="private">
                                        خاص — يظهر لي فقط
                                    </option>
                                    <option value="public">
                                        منشور — يظهر للأطباء
                                    </option>
                                </select>
                            </label>
                            <label class="md:col-span-2 lg:col-span-3">
                                <span class="text-xs font-bold text-slate-600">ملاحظات</span>
                                <textarea id="notes" rows="2" class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm" placeholder="أي ملاحظات أو تعليمات خاصة بالقالب">
                                </textarea>
                            </label>
                        </div>
                    </section>
                    <section class="mt-5 glass rounded-3xl overflow-hidden">
                        <div class="border-b border-slate-100 bg-white p-5">
                            <div id="dailySummary"></div>
                        </div>
                        <div class="p-4 sm:p-5 bg-slate-50/60">
                            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                                <div>
                                    <h3 class="font-extrabold text-slate-800">
                                        اليوم الغذائي
                                    </h3>
                                    <p class="mt-1 text-xs text-slate-400">
                                        أضف الوجبات ثم اختر الأصناف وحدد الكمية بالجرام.
                                    </p>
                                </div>
                                <button id="addMeal" class="rounded-xl bg-brand-600 px-4 py-2.5 text-xs font-bold text-white hover:bg-brand-700">
                                    <i class="fa-solid fa-plus ml-1"></i>إضافة وجبة
                                </button>
                            </div>
                            <div id="mealsEditor" class="mt-4 space-y-4">
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
        
        <div id="toast" class="fixed bottom-5 left-5 z-[150] hidden max-w-sm rounded-2xl px-5 py-3 text-sm font-bold text-white shadow-xl">
        </div>
        <script>
          // Independent fail-safe: remove blocking loader even if diet.js/auth never starts.
          window.__dietLoaderTimer=setTimeout(()=>{
            const overlay=document.getElementById('loading');
            if(overlay){
              overlay.style.display='none';
              const retry=document.getElementById('loadingRetry');
              if(retry){retry.classList.remove('hidden');retry.onclick=()=>location.reload();}
              console.error('Diet page startup timed out before initialization.');
            }
          },1500);
        </script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
        </script>
        <script src="js/dp-confirm.js?v=20261122-simple-confirm-v1"></script>
        <script src="js/diet-builder.js?v=20261123-central-meal-builder-v1"></script>
        <script src="js/nutrition-summary.js?v=20261123-central-summary-v2"></script>
        <script src="js/food-picker.js?v=20261123-single-source-v1"></script>
        <script src="js/auth-access.js?v=20261123-unrestricted-features-v1">
        </script>
        <script src="js/diet.js?v=20261123-central-food-picker-v3">
        </script>
    </body>
</html>
