<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>الخطة الغذائية | Diet Planner</title>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const patientId = params.get('id') || params.get('patient_id') || params.get('patient');
      if (patientId) {
        window.location.replace('patient-profile.html?id=' + encodeURIComponent(patientId));
        return;
      }
      window.location.replace('patient.html');
    })();
  </script>
</head>
<body>
  <p>تم نقل إدارة الخطط الغذائية إلى ملف المريض. جارٍ تحويلك...</p>
  <noscript><a href="patient.html">افتح قائمة المرضى</a></noscript>
</body>
</html>
