<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diet Planner | شاركنا رأيك</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/tailwind.css?v=20260923-2">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { cairo: ["Cairo", "sans-serif"] },
          colors: {
            brand: {
              50: "#eef7f6",
              100: "#d9efec",
              500: "#178f84",
              600: "#11786f",
              700: "#0d625b",
              800: "#0b504b"
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/feedback.css">
  <link rel="stylesheet" href="css/theme.css?v=20260921-3">
  <script src="js/theme.js?v=20260921-3"></script>
</head>
<body class="min-h-screen">
  <div id="loadingScreen" class="loading">
    <div class="flex flex-col items-center gap-3">
      <div class="spinner"></div>
      <div class="text-sm font-semibold text-slate-500">جاري تحميل الصفحة...</div>
    </div>
  </div>

  <main id="feedbackPage" class="min-h-screen px-4 py-6 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-2xl">
      <div class="mb-5 flex items-center justify-between gap-3">
        <a href="app.html" class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-bold text-slate-600 transition hover:border-brand-100 hover:bg-brand-50 hover:text-brand-700">
          <i class="fa-solid fa-arrow-right"></i>
          <span>الرئيسية</span>
        </a>
      </div>

      <section class="glass overflow-hidden rounded-3xl shadow-sm">
        <div class="bg-gradient-to-l from-brand-700 to-brand-500 px-6 py-8 text-white sm:px-8">
          <div class="flex items-center gap-4">
            <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-white/15">
              <i class="fa-solid fa-star text-2xl"></i>
            </div>
            <div>
              <h1 class="text-2xl font-extrabold sm:text-3xl">شاركنا رأيك</h1>
              <p class="mt-1 text-sm leading-6 text-white/85">رأيك يساعدنا على تطوير Diet Planner وتحسين تجربتك.</p>
            </div>
          </div>
        </div>

        <div class="px-6 py-7 sm:px-8">
          <div class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3">
            <div class="text-xs font-semibold text-slate-500">التقييم باسم</div>
            <div id="feedbackName" class="mt-1 font-extrabold text-slate-800">حساب المستخدم</div>
          </div>

          <form id="feedbackForm" class="mt-6">
            <input id="feedbackRating" type="hidden" value="">

            <div>
              <label class="text-sm font-extrabold text-slate-800">كيف تقيّم تجربتك؟</label>
              <div class="mt-3 flex items-center justify-center gap-2 rounded-2xl border border-slate-200 bg-white px-4 py-5" role="radiogroup" aria-label="التقييم من نجمة إلى خمس نجوم">
                <button type="button" data-rating="1" class="star-button text-slate-300" aria-label="نجمة واحدة" aria-checked="false">
                  <i class="fa-solid fa-star text-3xl"></i>
                </button>
                <button type="button" data-rating="2" class="star-button text-slate-300" aria-label="نجمتان" aria-checked="false">
                  <i class="fa-solid fa-star text-3xl"></i>
                </button>
                <button type="button" data-rating="3" class="star-button text-slate-300" aria-label="ثلاث نجوم" aria-checked="false">
                  <i class="fa-solid fa-star text-3xl"></i>
                </button>
                <button type="button" data-rating="4" class="star-button text-slate-300" aria-label="أربع نجوم" aria-checked="false">
                  <i class="fa-solid fa-star text-3xl"></i>
                </button>
                <button type="button" data-rating="5" class="star-button text-slate-300" aria-label="خمس نجوم" aria-checked="false">
                  <i class="fa-solid fa-star text-3xl"></i>
                </button>
              </div>
            </div>

            <div class="mt-6">
              <label for="feedbackComment" class="text-sm font-extrabold text-slate-800">رأيك وملاحظاتك</label>
              <textarea id="feedbackComment" maxlength="2000" rows="6" placeholder="اكتب رأيك في التطبيق أو أي ملاحظات تساعدنا على التطوير..." class="mt-2 w-full resize-y rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm leading-7 text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10"></textarea>
              <div class="mt-2 text-xs text-slate-400">الحد الأقصى 2000 حرف.</div>
            </div>

            <div class="mt-6 grid grid-cols-1 gap-3 sm:grid-cols-2">
              <button id="saveFeedbackBtn" type="submit" class="inline-flex h-12 items-center justify-center gap-2 rounded-xl bg-brand-600 px-5 text-sm font-extrabold text-white transition hover:bg-brand-700 disabled:cursor-not-allowed disabled:opacity-60">
                <i class="fa-solid fa-paper-plane"></i>
                <span>إرسال التقييم</span>
              </button>
              <button id="deleteFeedbackBtn" type="button" class="hidden inline-flex h-12 items-center justify-center gap-2 rounded-xl border border-red-200 bg-red-50 px-5 text-sm font-extrabold text-red-600 transition hover:bg-red-100 disabled:cursor-not-allowed disabled:opacity-60">
                <i class="fa-solid fa-trash"></i>
                <span>حذف التقييم</span>
              </button>
            </div>
          </form>

          <div id="feedbackStatus" class="hidden" role="status" aria-live="polite"></div>
        </div>
      </section>

      <section class="mt-6 glass overflow-hidden rounded-3xl shadow-sm">
        <div class="border-b border-slate-100 px-6 py-5 sm:px-8">
          <div class="flex items-center gap-3">
            <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-amber-50 text-amber-500">
              <i class="fa-solid fa-comments"></i>
            </div>
            <div>
              <h2 class="text-xl font-extrabold text-slate-800">آراء المستخدمين</h2>
              <p class="mt-1 text-xs text-slate-500">تقييمات وآراء مستخدمي Diet Planner</p>
            </div>
          </div>
        </div>

        <div class="px-6 py-6 sm:px-8">
          <div id="feedbackList" class="space-y-4"></div>
          <div id="feedbackEmpty" class="hidden rounded-2xl border border-dashed border-slate-200 bg-slate-50 px-5 py-8 text-center">
            <i class="fa-regular fa-comments text-2xl text-slate-300"></i>
            <p class="mt-2 text-sm font-semibold text-slate-500">لا توجد تقييمات حتى الآن.</p>
          </div>
        </div>
      </section>
    </div>
  </main>


  <!-- Delete confirmation modal -->
  <div id="feedbackDeleteModal" class="fixed inset-0 z-[300] hidden flex items-center justify-center bg-slate-900/45 px-4 backdrop-blur-[2px]" role="dialog" aria-modal="true" aria-labelledby="feedbackDeleteTitle">
    <div class="w-full max-w-sm rounded-3xl border border-slate-200 bg-white p-6 shadow-2xl">
      <div class="flex items-start gap-4">
        <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-red-50 text-red-600">
          <i class="fa-solid fa-trash"></i>
        </div>
        <div class="min-w-0">
          <h2 id="feedbackDeleteTitle" class="text-lg font-extrabold text-slate-800">حذف التقييم</h2>
          <p class="mt-2 text-sm leading-6 text-slate-500">هل أنت متأكد أنك تريد حذف تقييمك نهائيًا؟</p>
        </div>
      </div>
      <div class="mt-6 grid grid-cols-2 gap-3">
        <button id="cancelDeleteBtn" type="button" class="inline-flex h-11 items-center justify-center rounded-xl border border-slate-200 bg-white px-4 text-sm font-extrabold text-slate-600 transition hover:bg-slate-50">إلغاء</button>
        <button id="confirmDeleteBtn" type="button" class="inline-flex h-11 items-center justify-center gap-2 rounded-xl bg-red-600 px-4 text-sm font-extrabold text-white transition hover:bg-red-700">
          <i class="fa-solid fa-trash"></i>
          <span>حذف</span>
        </button>
      </div>
    </div>
  </div>

    <script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
    <script src="js/access.js?v=20260929-1"></script>
  <script src="js/access_pages.js"></script>
  <script src="js/feedback.js"></script>
  
</body>
</html>
