name: Restore visit diet module

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, 'Revert broken fixed-diet cache') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore previous working module
        shell: bash
        run: |
          set -e
          if grep -q 'fixedMealsLoadPromise = (async () => {>' js/visit-diet-plan.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git revert --no-edit 1d3673b399effdc291001f8d043475a4ebbb0af2
            git push
          else
            echo 'Broken cache change is not present; nothing to restore.'
          fi
