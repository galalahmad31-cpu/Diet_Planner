name: One-time fixed meals cache patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'galalahmad31-cpu' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fixed meals loader
        env:
          TARGET: js/visit-diet-plan.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/visit-diet-plan.js')
          s=p.read_text(encoding='utf-8')
          if 'fixedMealsLoadPromise' in s or 'fixedMealsLoaded' in s:
              print('Cache already present; nothing to do.')
              raise SystemExit(0)
          needle='async function syncFixedMeals('
          start=s.find(needle)
          if start < 0:
              raise SystemExit('syncFixedMeals not found')
          brace=s.find('{', start)
          if brace < 0:
              raise SystemExit('function opening brace not found')
          depth=0; end=None; in_str=None; esc=False; line_comment=False; block_comment=False
          i=brace
          while i < len(s):
              c=s[i]; n=s[i+1] if i+1 < len(s) else ''
              if line_comment:
                  if c=='\n': line_comment=False
              elif block_comment:
                  if c=='*' and n=='/': block_comment=False; i+=1
              elif in_str:
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c==in_str: in_str=None
              else:
                  if c in "'\"`": in_str=c
                  elif c=='/' and n=='/': line_comment=True; i+=1
                  elif c=='/' and n=='*': block_comment=True; i+=1
                  elif c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:
                          end=i+1; break
              i+=1
          if end is None:
              raise SystemExit('function end not found')
          state_old='let fixedMealsDatabase=[], fixedMealsTargetDayId=null, currentModalContext={dayId:null,mealId:null}, targetMealDayId=null, confirmCallback=null;'
          state_new=state_old+'\nlet fixedMealsLoadPromise=null, fixedMealsLoaded=false;'
          if state_old not in s:
              raise SystemExit('state declaration not found')
          s=s.replace(state_old,state_new,1)
          header=s[start:brace+1]
          body=s[brace+1:end-1]
          new=(header+'\n  if (fixedMealsLoaded) return true;\n  if (fixedMealsLoadPromise) return fixedMealsLoadPromise;\n  fixedMealsLoadPromise = (async () => {'+body+'\n  })();\n  try {\n    const result = await fixedMealsLoadPromise;\n    fixedMealsLoaded = result !== false;\n    return result;\n  } finally {\n    fixedMealsLoadPromise = null;\n  }\n}')
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/visit-diet-plan.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'perf: cache fixed diet library loading'
          git push
