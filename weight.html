<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Diet Planner | متابعة الوزن | د. أحمد جلال
        </title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/tailwind.css?v=20260923-2">
        <link rel="stylesheet" href="css/weight.css">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/supabase.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/access.js?v=20260929-1"></script>
        <script src="js/access_pages.js"></script>
        <script src="js/weight.js" defer></script>
        <link rel="stylesheet" href="css/theme.css?v=20260921-3">
        <script src="js/theme.js?v=20260921-3">
        </script>
    </head>
    <body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
        <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 no-print">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-900/40">
                        <i class="fa-solid fa-leaf text-white text-xl">
                        </i>
                    </div>
                    <div>
                        <h1 class="font-black text-lg sm:text-xl tracking-tight leading-tight">
                            Diet Planner
                        </h1>
                        <p class="text-sm font-bold text-emerald-400">
                            د. أحمد جلال
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <a id="dashboardBtn" href="app.html" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition shadow-sm flex items-center gap-2">
                        <i class="fa-solid fa-house">
                        </i>
                        <span>
                            الرئيسية
                        </span>
                    </a>
                    <a id="backBtn" href="#" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition shadow-sm flex items-center gap-2">
                        <i class="fa-solid fa-arrow-right">
                        </i>
                        <span>
                            ملف المريض
                        </span>
                    </a>
                </div>
            </div>
        </header>
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            <section class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-emerald-600 text-white flex items-center justify-center">
                        <i class="fa-solid fa-chart-line">
                        </i>
                    </div>
                    <div>
                        <h2 class="font-black text-slate-800 text-base">
                            متابعة الوزن
                        </h2>
                        <p id="patientName" class="text-[10px] text-slate-400 mt-1">
                            جاري تحميل بيانات المريض...
                        </p>
                    </div>
                </div>
            </section>
            <section id="weightTab" class="space-y-6">
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                        <span class="block text-xs font-bold text-slate-400 mb-1">
                            الوزن الأولي المسجل
                        </span>
                        <div class="flex items-baseline gap-1">
                            <span id="kpiStartWeight" class="text-2xl font-black text-slate-800">
                                --
                            </span>
                            <span class="text-xs font-semibold text-slate-500">
                                كجم
                            </span>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                        <span class="block text-xs font-bold text-slate-400 mb-1">
                            الوزن الحالي الأخير
                        </span>
                        <div class="flex items-baseline gap-1">
                            <span id="kpiCurrentWeight" class="text-2xl font-black text-emerald-600">
                                --
                            </span>
                            <span class="text-xs font-semibold text-slate-500">
                                كجم
                            </span>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                        <span class="block text-xs font-bold text-slate-400 mb-1">
                            التغير الكلي
                        </span>
                        <div class="flex items-baseline gap-1">
                            <span id="kpiTotalDiff" class="text-2xl font-black text-slate-800">
                                --
                            </span>
                            <span class="text-xs font-semibold text-slate-500">
                                كجم
                            </span>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                        <span class="block text-xs font-bold text-slate-400 mb-1">
                            مؤشر كتلة الجسم (BMI)
                        </span>
                        <div class="flex items-baseline gap-1">
                            <span id="kpiBMI" class="text-2xl font-black text-slate-800">
                                --
                            </span>
                        </div>
                        <span id="kpiBMIStatus" class="text-xs block font-bold mt-0.5 text-slate-400">
                            غير محدد
                        </span>
                    </div>
                </div>
                <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-right text-xs">
                            <thead class="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                                <tr>
                                    <th class="py-3 px-3">
                                        التاريخ
                                    </th>
                                    <th class="py-3 px-3 text-center">
                                        الوزن
                                    </th>
                                    <th class="py-3 px-3 text-center">
                                        التغير
                                    </th>
                                    <th class="py-3 px-2 text-center no-print">
                                        إجراء
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="weightTableBody" class="divide-y divide-slate-100 text-slate-700">
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4 no-print">
                        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-plus-circle text-emerald-600">
                            </i>
                            <span>
                                تسجيل قياس وزن جديد
                            </span>
                        </h3>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">
                                    تاريخ القياس
                                </label>
                                <input type="date" id="weightLogDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">
                                    الوزن (كجم)
                                </label>
                                <input type="number" step="0.1" id="weightLogVal" placeholder="مثال: 78.5" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:border-emerald-500">
                            </div>
                            <button id="addWeightBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2.5 rounded-xl transition shadow-sm cursor-pointer active:scale-95">
                                إضافة القياس
                            </button>
                        </div>
                    </div>
                    <div class="lg:col-span-2 bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between">
                        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2 mb-3">
                            <i class="fa-solid fa-chart-area text-emerald-600">
                            </i>
                            <span>
                                منحنى تطور الوزن الزمني
                            </span>
                            <select id="weightAxisStep" class="mr-auto bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-[10px] font-bold text-slate-600">
                                <option value="0.5">
                                    0.5 كجم
                                </option>
                                <option value="1" selected>
                                    1 كجم
                                </option>
                                <option value="2">
                                    2 كجم
                                </option>
                                <option value="5">
                                    5 كجم
                                </option>
                            </select>
                        </h3>
                        <div id="weightChartContainer" class="w-full h-64 flex items-center justify-center bg-white rounded-xl border border-slate-100 p-2">
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2.5 rounded-xl text-xs font-bold shadow-lg">
        </div>
    </body>
</html>
