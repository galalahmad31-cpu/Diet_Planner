<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المرضى | Diet Planner | د. أحمد جلال</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/tailwind.css?v=20260923-2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth-access.js?v=20261120-page-access-v1"></script>
  <script src="js/patient.js?v=20261120-login-gate-v1" defer></script>

  <link rel="stylesheet" href="css/patient.css?v=20261120-patient-list-compact-v1">
  <link rel="stylesheet" href="css/design-tokens.css?v=20261120-central-v2">
<link rel="stylesheet" href="css/light-theme.css?v=20261120-central-v2">
<link rel="stylesheet" href="css/dark-theme.css?v=20261120-central-v5">
  <script src="js/theme.js?v=20261120-central-v11"></script>
  <link rel="stylesheet" href="css/components.css?v=20261120-central-v2">
  <link rel="stylesheet" href="css/app-header.css?v=20261120-central-header-v7">
  <script src="js/app-header.js?v=20261120-central-account-v5" defer></script>
</head>

<body class="min-h-screen">

<div data-dp-app-header data-page-title="قائمة المرضى"></div>

<main class="w-full max-w-none mx-0 px-3 sm:px-4 py-4">

  <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">

    <div class="p-5 border-b border-slate-100">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h2 class="font-black text-slate-800 text-xl">ملفات المرضى</h2>
          <p class="text-xs text-slate-400 mt-1">اختر المريض لفتح ملفه الكامل.</p>
        </div>

        <button id="addPatientBtn" type="button" data-action="open-add-patient"
          class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold px-4 py-2.5 rounded-xl transition shadow-sm">
          + إضافة مريض
        </button>
      </div>

      <div class="mt-4">
        <input id="searchInput" type="search"
          placeholder="البحث باسم المريض..."
          
          class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:border-emerald-500">
      </div>
    </div>

    <div id="patientStats" class="patient-stats" aria-label="إحصائيات المرضى">
      <button type="button" class="patient-stat is-selected" data-status-filter="all" aria-pressed="true">
        <span class="patient-stat-label">إجمالي المرضى</span>
        <strong id="totalPatientsCount">—</strong>
      </button>
      <button type="button" class="patient-stat" data-status-filter="active" aria-pressed="false">
        <span class="patient-stat-label">ملفات نشطة</span>
        <strong id="activePatientsCount">—</strong>
      </button>
      <button type="button" class="patient-stat" data-status-filter="expired" aria-pressed="false">
        <span class="patient-stat-label">ملفات منتهية</span>
        <strong id="expiredPatientsCount">—</strong>
      </button>
      <button type="button" class="patient-stat" data-status-filter="unknown" aria-pressed="false">
        <span class="patient-stat-label">اشتراك غير محدد</span>
        <strong id="unknownPatientsCount">—</strong>
      </button>
    </div>

    <div id="statusBox" class="px-5 pt-3"></div>
    <div id="patientsList" class="patient-list" aria-live="polite">
      <div class="loading text-center text-sm text-slate-400 py-10">جاري تحميل المرضى...</div>
    </div>

  </section>
</main>

<!-- ADD PATIENT -->
<div id="addPatientModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl">
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <h3 class="font-black text-slate-800">إضافة مريض جديد</h3>
      <button data-action="close-add-patient" class="text-slate-400 hover:text-slate-700 text-xl">×</button>
    </div>

    <div class="mt-4">
      <label class="block text-xs font-bold text-slate-600 mb-1">اسم المريض</label>
      <input id="newPatientName" type="text" placeholder="أدخل اسم المريض..."
        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold focus:outline-none focus:border-emerald-500">
    </div>

    <div class="flex gap-2 mt-5">
      <button data-action="create-patient"
        class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2.5 rounded-xl">
        حفظ وفتح الملف
      </button>
      <button data-action="close-add-patient"
        class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs px-4 py-2.5 rounded-xl">
        إلغاء
      </button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div id="deleteModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl text-center">
    <div class="w-14 h-14 mx-auto rounded-full bg-red-50 flex items-center justify-center text-2xl">🗑️</div>
    <h3 class="font-black text-slate-800 mt-3">حذف المريض</h3>
    <p id="deleteText" class="text-xs text-slate-500 mt-2"></p>

    <div class="flex gap-2 mt-5">
      <button id="confirmDeleteBtn"
        class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold text-xs py-2.5 rounded-xl">
        حذف
      </button>
      <button data-action="close-delete"
        class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs px-4 py-2.5 rounded-xl">
        إلغاء
      </button>
    </div>
  </div>
</div>

  
</body>
</html>
