<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استعادة كلمة المرور | Diet Planner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/forgot-password.css">
<link rel="stylesheet" href="css/design-tokens.css?v=20261122-responsive-foundation-v1">
<link rel="stylesheet" href="css/light-theme.css?v=20261120-central-v2">
<link rel="stylesheet" href="css/dark-theme.css?v=20261120-central-v4">
<script src="js/theme.js?v=20261121-header-only-v15" data-diet-planner-theme="true"></script>
<link rel="stylesheet" href="css/components.css?v=20261120-central-v2">
</head>
<body>
<main class="card" aria-labelledby="recoveryTitle">
  <div class="logo" aria-hidden="true">↻</div>
  <h1 id="recoveryTitle">استعادة كلمة المرور</h1>
  <p class="sub">استعد الوصول إلى حسابك باستخدام رمز تحقق يُرسل إلى بريدك الإلكتروني.</p>
  <div id="recoveryMessage" class="msg" role="status" aria-live="polite"></div>

  <section id="recoveryEmailStep">
    <div class="field">
      <label for="recoveryEmail">البريد الإلكتروني</label>
      <input id="recoveryEmail" type="email" autocomplete="email" inputmode="email" required>
    </div>
    <button id="sendRecoveryOtpButton" type="button" class="btn">إرسال رمز الاستعادة</button>
  </section>

  <section id="recoveryOtpStep" hidden>
    <div class="field">
      <label for="recoveryOtp">رمز التحقق المكوّن من 8 أرقام</label>
      <input id="recoveryOtp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}" placeholder="00000000">
      <p id="recoveryOtpEmail" class="field-hint"></p>
    </div>
    <button id="verifyRecoveryOtpButton" type="button" class="btn">تأكيد الرمز</button>
    <button id="resendRecoveryOtpButton" type="button" class="btn secondary">إعادة إرسال الرمز</button>
    <button id="changeRecoveryEmailButton" type="button" class="text-button">تغيير البريد الإلكتروني</button>
  </section>

  <section id="recoveryPasswordStep" hidden>
    <div class="field">
      <label for="newRecoveryPassword">كلمة المرور الجديدة</label>
      <input id="newRecoveryPassword" type="password" autocomplete="new-password" required>
      <p class="field-hint">8 أحرف على الأقل، مع حرف كبير وحرف صغير ورقم ورمز.</p>
    </div>
    <div class="field">
      <label for="confirmRecoveryPassword">تأكيد كلمة المرور</label>
      <input id="confirmRecoveryPassword" type="password" autocomplete="new-password" required>
    </div>
    <button id="saveRecoveryPasswordButton" type="button" class="btn">حفظ كلمة المرور الجديدة</button>
  </section>
  <div class="back"><a href="login.html">العودة إلى تسجيل الدخول</a></div>
</main>
<script src="js/auth-access.js?v=20261125-central-recovery-otp-v1"></script>
<script>
document.getElementById("changeRecoveryEmailButton")?.addEventListener("click", () => {
  document.getElementById("recoveryOtpStep").hidden = true;
  document.getElementById("recoveryEmailStep").hidden = false;
  document.getElementById("recoveryMessage").style.display = "none";
});
</script>
</body>
</html>
