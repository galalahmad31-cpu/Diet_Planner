<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول | Diet Planner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/index.css?v=20261119-email-otp-v2">
  <link rel="stylesheet" href="css/theme.css?v=20260921-3">
  <script src="js/theme.js?v=20260921-3"></script>
</head>
<body>

<div class="card">
<div class="logo"><i class="fa-solid fa-leaf"></i></div>
<h1>Diet Planner</h1>
<div class="auth-intro">مساحتك المهنية لتنظيم التغذية العلاجية</div>
<div class="sub">نظام إدارة الخطط الغذائية</div>
<div class="tabs">
<button type="button" data-auth-tab="loginForm" class="active">تسجيل الدخول</button>
<button type="button" data-auth-tab="registerForm">إنشاء حساب</button>
</div>
<div id="authMessage" class="msg"></div>
<form id="loginForm" class="auth-form">
<div class="field"><label for="loginEmail">البريد الإلكتروني</label><input id="loginEmail" name="email" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com" required></div>
<div class="field"><label for="loginPassword">كلمة المرور</label><div class="password-wrap"><input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور" required><button type="button" class="show-password" data-toggle-password="loginPassword" aria-label="إظهار كلمة المرور"><i class="fa-regular fa-eye"></i></button></div></div>
<div style="text-align:left;margin-top:-7px;margin-bottom:14px;"><a href="forgot-password.html" style="color:#11786f;text-decoration:none;font-size:12px;font-weight:700;">نسيت كلمة المرور؟</a></div>
<button id="loginButton" type="button" class="btn">تسجيل الدخول</button>
<div class="divider"><span>أو</span></div>
<button id="googleLoginButton" type="button" class="google-btn">
<i class="fa-brands fa-google"></i>
<span>المتابعة باستخدام Google</span>
</button>
<div class="auth-footer"><a href="index.html">← العودة للرئيسية</a><a href="privacy.html">سياسة الخصوصية</a></div>
<div style="text-align:center;margin-top:12px;">
  
</div>
</form>
<form id="registerForm" class="auth-form" style="display:none">
<div id="registerFields">
<div class="field"><label for="registerName">الاسم بالكامل</label><input id="registerName" name="name" type="text" autocomplete="name" placeholder="اسمك" required></div>
<div class="field"><label for="registerEmail">البريد الإلكتروني</label><input id="registerEmail" name="email" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com" required></div>
<div class="field"><label for="registerPassword">كلمة المرور</label><div class="password-wrap"><input id="registerPassword" name="new-password" type="password" autocomplete="new-password" placeholder="8 أحرف على الأقل" required><button type="button" class="show-password" data-toggle-password="registerPassword" aria-label="إظهار كلمة المرور"><i class="fa-regular fa-eye"></i></button></div><p class="field-hint">استخدم كلمة مرور قوية تحتوي على أحرف وأرقام ورمز.</p></div>
<button id="registerButton" type="button" class="btn">إنشاء الحساب</button>
</div>
<div id="signupOtpPanel" hidden>
  <div class="field">
    <label for="signupOtp">رمز التحقق المرسل إلى بريدك الإلكتروني</label>
    <input id="signupOtp" name="one-time-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" placeholder="00000000" aria-describedby="signupOtpEmail" style="text-align:center;direction:ltr;letter-spacing:8px;font-size:24px;font-weight:800;">
    <p id="signupOtpEmail" class="field-hint" style="direction:ltr;text-align:center;"></p>
  </div>
  <button id="verifySignupOtpButton" type="button" class="btn">تأكيد البريد الإلكتروني</button>
  <button id="resendSignupOtpButton" type="button" class="google-btn" style="margin-top:10px;">إعادة إرسال الرمز</button>
</div>
</form>
<div class="auth-bottom-note">بياناتك وحسابك في مكان واحد — Diet Planner</div>
</div>
<script>
document.querySelectorAll("[data-toggle-password]").forEach(button=>button.addEventListener("click",()=>{const input=document.getElementById(button.dataset.togglePassword);const visible=input.type==="password";input.type=visible?"text":"password";button.innerHTML=visible?'<i class="fa-regular fa-eye-slash"></i>':'<i class="fa-regular fa-eye"></i>';button.setAttribute("aria-label",visible?"إخفاء كلمة المرور":"إظهار كلمة المرور")}));
</script>
<script src="js/auth-access.js?v=20261119-email-otp-v4"></script>

  
</body>
</html>
