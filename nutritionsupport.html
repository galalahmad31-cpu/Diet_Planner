<!DOCTYPE html>

<html dir="ltr" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>الدعم الغذائي | Diet Planner</title>
<!-- =========================================================
         ACCESS PROTECTION
         The calculator is available only after successful login.
         ========================================================= -->

<!-- SUBSCRIPTION MONITORING -->
<link rel="stylesheet" href="css/nutritionsupport.css">
  <link rel="stylesheet" href="css/theme.css?v=20260921-3">
  <script src="js/theme.js?v=20260921-3"></script>
</head>
<body class="p-2 md:p-6">
<div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-200 container-main">
<!-- =========================================================
         HEADER
         ========================================================= -->
<header class="support-header">
<div class="support-brand"><div class="support-brand-icon" aria-hidden="true">
<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
<rect x="4" y="3" width="16" height="18" rx="2"></rect>
<path d="M8 7h8M8 11h5M8 15h8M8 19h5"></path>
<path d="M16 11v4M14 13h4"></path>
</svg>
</div><div><h1>الدعم الغذائي</h1><p>Nutrition Support</p></div></div>
<div class="header-actions"><a class="home-btn" href="app.html"><i class="fa-solid fa-arrow-right"></i> الرئيسية</a></div>
</header>
<div class="support-patient-area no-print" id="supportPatientArea">
<div class="support-patient-top">
<div>
<div class="support-kicker">الدعم الغذائي</div>
<h2>اختر المريض</h2>
<p>بيانات المريض تُقرأ مباشرة من قائمة المرضى.</p>
</div>
<div class="patient-management-actions no-print"><button type="button" class="add-patient-btn" id="addPatientBtn"><i class="fa-solid fa-user-plus"></i> إضافة مريض</button></div>
</div>
<div class="patient-search"><i class="fa-solid fa-magnifying-glass"></i><input id="patientSearch" type="search" placeholder="ابحث باسم المريض أو التشخيص..." autocomplete="off"></div>
<div class="patient-grid" id="patientGrid"></div>
<div class="patient-empty" id="patientEmpty" style="display:none">لا يوجد مرضى حاليًا.</div>
</div>

<!-- Patient add/edit modal -->
<div class="patient-modal-overlay no-print" id="patientModalOverlay" aria-hidden="true">
  <div class="patient-modal" role="dialog" aria-modal="true" aria-labelledby="patientModalTitle">
    <div class="patient-modal-header">
      <h3 class="patient-modal-title" id="patientModalTitle">إضافة مريض</h3>
      <button type="button" class="patient-modal-close" id="patientModalClose" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="patientForm">
      <input type="hidden" id="patientId">
      <div class="patient-form-grid">
        <div class="patient-form-field full"><label for="patientName">اسم المريض</label><input id="patientName" required autocomplete="off"></div>
        <div class="patient-form-field"><label for="patientGender">النوع</label><select id="patientGender"><option value="">اختر النوع</option><option value="ذكر">ذكر</option><option value="أنثى">أنثى</option></select></div>
        <div class="patient-form-field"><label for="patientBirthDate">تاريخ الميلاد</label><input id="patientBirthDate" type="date"></div>
        <div class="patient-form-field"><label for="patientAge">العمر (سنة)</label><input id="patientAge" type="number" min="0" step="1"></div>
        <div class="patient-form-field"><label for="patientHeight">الطول (سم)</label><input id="patientHeight" type="number" min="0" step="0.1"></div>
        <div class="patient-form-field full"><label for="patientDiagnosis">التشخيص</label><input id="patientDiagnosis" autocomplete="off"></div>
        <div class="patient-form-field full"><label for="patientComplaints">الشكوى / الأعراض</label><textarea id="patientComplaints"></textarea></div>
        <div class="patient-form-field full"><label for="patientClinicalNotes">ملاحظات سريرية</label><textarea id="patientClinicalNotes"></textarea></div>
      </div>
      <div class="patient-modal-actions">
        <button type="submit" class="patient-save-btn" id="patientSaveBtn"><i class="fa-solid fa-floppy-disk"></i> حفظ</button>
        <button type="button" class="patient-cancel-btn" id="patientCancelBtn">إلغاء</button>
      </div>
    </form>
  </div>
</div>

</div>

<div class="patient-delete-confirm" id="patientDeleteConfirm" aria-hidden="true">
  <div class="patient-delete-box" role="dialog" aria-modal="true" aria-labelledby="patientDeleteTitle">
    <div class="patient-delete-icon"><i class="fa-solid fa-trash"></i></div>
    <h3 id="patientDeleteTitle">تأكيد حذف المريض</h3>
    <p id="patientDeleteText">هل أنت متأكد من حذف هذا المريض؟</p>
    <div class="patient-delete-actions">
      <button type="button" class="patient-delete-cancel" id="patientDeleteCancel">إلغاء</button>
      <button type="button" class="patient-delete-ok" id="patientDeleteConfirmBtn">حذف</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
    <script src="js/access.js?v=20260929-1"></script>
         <script src="js/access_pages.js"></script>
<script src="js/nutritionsupport.js"></script>
  
</body>
</html>
