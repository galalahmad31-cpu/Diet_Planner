<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ملفي المهني | Diet Planner</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/design-tokens.css?v=20261122-responsive-foundation-v1"><link rel="stylesheet" href="css/light-theme.css?v=20261120-central-v2"><link rel="stylesheet" href="css/dark-theme.css?v=20261120-central-v5"><link rel="stylesheet" href="css/dp-confirm.css?v=20261122-simple-confirm-v1"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/app-header.css?v=20261124-contact-v1"><link rel="stylesheet" href="css/professional-directory.css?v=20261121-offers-v1"><link rel="stylesheet" href="css/professional-directory-manage.css?v=20261122-single-editor-v1"><script src="js/theme.js?v=20261121-header-only-v15" defer></script><script src="js/app-header.js?v=20261124-central-header-v2" defer></script><script src="js/auth-access.js?v=20261121-google-account-type-v1"></script><script src="js/dp-confirm.js?v=20261122-simple-confirm-v1" defer></script><script src="js/professional-directory-manage.js?v=20261122-single-editor-confirm-v1" defer></script></head><body class="directory-page"><main class="directory-main"><div data-dp-app-header data-page-title="ملفي المهني"></div><section class="directory-hero" id="professionalProfileHero"><div><small>PROFESSIONAL PROFILE</small><h1>ملفك المهني على المنصة</h1><p>الظهور في الدليل اختياري، ولا يصبح ملفك عامًا إلا بعد المراجعة والاعتماد.</p></div></section><section class="directory-editor" id="professionalProfileEditor"><h2>بيانات الملف المهني</h2><p id="professionalProfileStatus" role="status">جاري تحميل الملف...</p><form id="professionalProfileForm"><div class="professional-profile-core-grid"><label>الاسم الظاهر<input id="professionalDisplayName" required maxlength="120"></label><label>المسمى المهني<input id="professionalTitle" required maxlength="160" placeholder="مثال: أخصائي تغذية علاجية"></label><label>التخصصات ومجالات العمل<input id="professionalSpecialties" required placeholder="تغذية علاجية، سمنة، تغذية كلوية"></label><label>سنوات الخبرة<input id="professionalExperience" type="number" min="0" max="70"></label></div><label class="professional-profile-bio">نبذة مهنية<textarea id="professionalBio" maxlength="2000" rows="3"></textarea></label><div class="professional-profile-location-grid"><label>المحافظة<input id="professionalGovernorate" required></label><label>المدينة<input id="professionalCity" required></label><label>رابط صورة شخصية (HTTPS)<input id="professionalPhoto" type="url" placeholder="https://..."></label><fieldset class="professional-profile-service-modes"><legend>طرق تقديم الخدمة</legend><label><input type="checkbox" name="serviceMode" value="online"> أونلاين</label><label><input type="checkbox" name="serviceMode" value="in_person"> حضوري</label></fieldset></div><section class="professional-offers-editor" aria-labelledby="professionalOffersTitle"><div class="professional-offers-heading"><div><h3 id="professionalOffersTitle">الخدمات والأسعار</h3><p>أضف حتى 10 خدمات أو باقات. يمكنك تحديد سعر العرض والسعر الأصلي اختياريًا.</p></div><button type="button" id="addProfessionalOffer" class="directory-offer-add">إضافة خدمة</button></div><div id="professionalOffersList" class="professional-offers-list"></div><p id="professionalOffersStatus" class="professional-offers-status" role="status"></p></section><div class="professional-profile-actions"><button class="directory-request" type="submit">حفظ كمسودة</button><button class="professional-profile-submit" type="button" id="saveAndSubmitForReview">حفظ وإرسال للاعتماد</button><button type="button" id="deleteProfessionalProfile" class="professional-profile-delete" hidden>حذف الملف</button><button type="button" id="withdrawDirectoryProfile" class="directory-request" hidden>إلغاء الإجراء</button></div></form></section></main></body></html>
