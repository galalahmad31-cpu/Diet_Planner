<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عن التطبيق  | Diet Planner</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/tailwind.css?v=20260923-2">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { cairo: ['Cairo', 'sans-serif'] },
          colors: {
            brand: {
              50: '#eef7f6',
              100: '#d9efec',
              500: '#178f84',
              600: '#11786f',
              700: '#0d625b',
              800: '#0b504b'
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/about.css">
  <link rel="stylesheet" href="css/theme.css?v=20260921-3">
  <script src="js/theme.js?v=20260921-3"></script>
</head>

<body class="min-h-screen">

  <main class="min-h-screen px-4 py-6 sm:px-6">
    <div class="mx-auto max-w-4xl">

      <section class="glass rounded-3xl p-5 sm:p-7 mb-5">
        <div class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-3 min-w-0">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-brand-50 text-brand-600">
              <i class="fa-solid fa-circle-info text-xl"></i>
            </div>
            <div class="min-w-0">
              <h1 class="text-xl sm:text-2xl font-black text-slate-800">عن التطبيق</h1>
              <p class="mt-1 text-xs sm:text-sm font-semibold text-slate-400">
                محتوى تعريفي عن Diet Planner ومزاياه وطريقة استخدامه.
              </p>
            </div>
          </div>

          <a href="app.html"
             class="shrink-0 inline-flex items-center justify-center gap-2 rounded-xl bg-slate-800 px-4 py-2.5 text-xs font-extrabold text-white hover:bg-slate-700 transition">
            <i class="fa-solid fa-house"></i>
            الرئيسية
          </a>
        </div>

        <div class="mt-5 flex justify-end">
          <button id="addSectionBtn" type="button"
                  class="hidden inline-flex items-center justify-center gap-2 rounded-xl bg-brand-600 px-4 py-2.5 text-xs font-extrabold text-white shadow-sm hover:bg-brand-700 transition">
            <i class="fa-solid fa-plus"></i>
            إضافة مربع
          </button>
        </div>
      </section>

      <section>
        <div id="sectionsContainer" class="space-y-4"></div>

        <div id="emptyState" class="hidden rounded-2xl border border-dashed border-slate-200 bg-slate-50 p-8 text-center">
          <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-white text-slate-400 shadow-sm">
            <i class="fa-regular fa-file-lines text-lg"></i>
          </div>
          <p class="mt-3 text-sm font-bold text-slate-600">لا يوجد محتوى بعد</p>
          <p id="emptyHint" class="mt-1 text-xs text-slate-400">سيظهر المحتوى هنا عند إضافته.</p>
        </div>
      </section>

      <footer class="py-6 text-center">
        <a href="app.html" class="text-xs font-bold text-brand-600 hover:text-brand-700">Diet Planner</a>
      </footer>
    </div>
  </main>

  <!-- Link dialog -->
  <div id="linkModal" class="hidden fixed inset-0 z-[210] items-center justify-center bg-slate-900/45 px-4">
    <div class="glass w-full max-w-md rounded-3xl p-6 shadow-2xl">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-brand-50 text-brand-600">
        <i class="fa-solid fa-link"></i>
      </div>
      <h3 class="mt-4 text-center text-lg font-black text-slate-800">إضافة رابط</h3>
      <p class="mt-2 text-center text-sm leading-7 text-slate-500">أدخل الرابط الذي سيفتح عند الضغط على النص أو الرمز المحدد.</p>
      <input id="linkUrlInput" type="url" dir="ltr" inputmode="url" autocomplete="url"
             placeholder="https://example.com"
             class="mt-4 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-left text-sm font-semibold text-slate-700 outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100">
      <div class="mt-5 grid grid-cols-2 gap-3">
        <button id="cancelLinkBtn" type="button" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-xs font-extrabold text-slate-600 hover:bg-slate-50">إلغاء</button>
        <button id="applyLinkBtn" type="button" class="rounded-xl bg-brand-600 px-4 py-2.5 text-xs font-extrabold text-white hover:bg-brand-700">إضافة الرابط</button>
      </div>
    </div>
  </div>

  <!-- Delete confirmation -->
  <div id="deleteModal" class="hidden fixed inset-0 z-[200] items-center justify-center bg-slate-900/45 px-4">
    <div class="glass w-full max-w-sm rounded-3xl p-6 shadow-2xl">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-red-50 text-red-600">
        <i class="fa-solid fa-trash"></i>
      </div>
      <h3 class="mt-4 text-center text-lg font-black text-slate-800">تأكيد الحذف</h3>
      <p class="mt-2 text-center text-sm leading-7 text-slate-500">هل أنت متأكد من حذف هذا المربع؟ لا يمكن التراجع عن هذا الإجراء.</p>
      <div class="mt-5 grid grid-cols-2 gap-3">
        <button id="cancelDeleteBtn" type="button" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-xs font-extrabold text-slate-600 hover:bg-slate-50">إلغاء</button>
        <button id="confirmDeleteBtn" type="button" class="rounded-xl bg-red-600 px-4 py-2.5 text-xs font-extrabold text-white hover:bg-red-700">حذف</button>
      </div>
    </div>
  </div>

   <script src="js/supabase.js"></script>
   <script src="js/auth.js"></script>
  <script src="js/access.js?v=20260929-1"></script>
  <script src="js/access_pages.js"></script>
  <script src="js/about.js"></script>
  
</body>
</html>
